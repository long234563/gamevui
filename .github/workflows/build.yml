name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Convert HTML to Android Project
        shell: bash
        run: |
          test -f index.html
          mkdir -p "$RUNNER_TEMP/hac-anh-build/www"
          cp index.html "$RUNNER_TEMP/hac-anh-build/www/index.html"
          cd "$RUNNER_TEMP/hac-anh-build"
          npm init -y
          npm install --save-exact @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap init "My Game" "com.mygame.shadow" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: ${{ runner.temp }}/hac-anh-build/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: ${{ runner.temp }}/hac-anh-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

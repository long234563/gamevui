name: Thiên Chiến - Build APK

on:
  push:
    branches: [main]
    paths:
      - 'thien-chien-android/**'
      - '.github/workflows/thien-chien-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android Platform 35
        shell: bash
        run: |
          echo "Android SDK location: $ANDROID_HOME"
          test -n "$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDK_MANAGER="$(command -v sdkmanager)"
          fi
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble installable APK
        working-directory: thien-chien-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thien-Chien-APK
          path: thien-chien-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
